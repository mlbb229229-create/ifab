// swipe gesture
let sx=0;addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>80&&Math.abs(dx)<innerWidth/2){if(dx<0&&PAGE.next)toPage(PAGE.next);if(dx>0&&PAGE.prev)toPage(PAGE.prev)}});
// tab bar sync (highlight current page in bottom nav)
const curTab={index:{'07-home':'星球','messages':'消息','messages-filter':'消息','intimacy':'我的','group-chat':'广场','persona-chat':'广场'}}[SLUG];
if(curTab){const tab=byText(curTab);if(tab){const btn=tab.closest('[data-text]')||tab.parentElement;if(btn)btn.classList.add('tab-active')}}
// generic nav rules
(PAGE.rules||[]).forEach(r=>{let el=null;if(r.text)el=byText(r.text);if(!el&&r.contains)el=byTextAny(r.contains);if(!el&&r.icon)el=byIcon(r.icon);if(!el&&r.name)el=byName(r.name);if(el){
  if(r.to)clickable(el,r.to);else if(r.act==='toast'){el.classList.add('u-click');el.addEventListener('click',()=>toast(r.msg||'敬请期待','●'))}
}});
// toggle groups (segmented / chips)
document.querySelectorAll('[data-toggle-group]').forEach(g=>{g.querySelectorAll(':scope [data-toggle]').forEach(c=>{c.classList.add('u-click');c.addEventListener('click',()=>{if(g.dataset.toggleGroup==='multi'){c.classList.toggle('chip-on')}else{g.querySelectorAll('.chip-on').forEach(x=>x.classList.remove('chip-on'));c.classList.add('chip-on')}})})});
</script>
<script>

(function(){const g=byName("seg");if(!g)return;g.dataset.toggleGroup="single";[...g.children].forEach(c=>{c.dataset.toggle='1';c.classList.add('u-click');c.addEventListener('click',()=>{if("single"==='multi'){c.classList.toggle('chip-on')}else{[...g.children].forEach(x=>x.classList.remove('chip-on'));c.classList.add('chip-on')}})})})();
</script>
<script>
// real nickname + date inputs + animated progress + validation
(function(){const ph=byText('例如：小星');if(ph){const inp=document.createElement('input');inp.placeholder='例如：小星';const cs=getComputedStyle(ph);inp.style.cssText='background:transparent;border:none;outline:none;color:#fff;font-family:inherit;font-size:'+cs.fontSize+';width:100%';ph.replaceWith(inp)}})();
(function(){const d=byText('1998-04-12');if(d){const inp=document.createElement('input');inp.type='date';inp.value='1998-04-12';const cs=getComputedStyle(d);inp.style.cssText='background:transparent;border:none;outline:none;color:#fff;font-family:inherit;font-size:'+cs.fontSize+';color-scheme:dark;width:150px';d.replaceWith(inp)}})();
// progress animation
(function(){document.querySelectorAll('[data-name^="p3"]').forEach((r,i)=>{r.style.transition='width .6s cubic-bezier(.22,.9,.3,1) '+(i*100)+'ms';setTimeout(()=>{if(r.dataset.name==='p3a')r.style.width='100%';if(r.dataset.name==='p3b')r.style.width='100%';if(r.dataset.name==='p3c')r.style.width='40%'},200)})})();
// step validation on "next"
(function(){const n=byTextAny('下一步');if(n){n.closest('[data-name]').addEventListener('click',(e)=>{e.stopPropagation();const name=document.querySelector('input');if(name&&!name.value.trim()){name.style.outline='1.5px solid var(--ca)';name.style.borderRadius='8px';setTimeout(()=>name.style.outline='none',1500);toast('请先填写昵称','✎');return}toPage('04-create-persona.html')})}})();
</script>
<script>(function(){var bar=document.createElement('div');
bar.style.cssText='display:flex;align-items:center;gap:4px;padding:8px 12px;background:rgba(14,14,18,.92);border-bottom:1px solid rgba(255,255,255,.06);position:sticky;top:0;z-index:40;overflow:hidden';
bar.innerHTML='<span class="icon-chevron-left" style="font-size:20px;margin-right:4px;color:#fff;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:999px;cursor:pointer;flex:none"></span><span style="font-size:15px;font-weight:600;color:rgba(255,255,255,.8)">登录注册</span>';
bar.querySelector('.icon-chevron-left').onclick=function(){toPage('02-login.html')};
var can=document.querySelector('.canvas');if(can)can.insertBefore(bar,can.firstChild);})();</script>
