setTimeout(()=>document.querySelector('.canvas').classList.remove('page-enter'),500);
// keyboard nav
addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&PAGE.next)toPage(PAGE.next);if(e.key==='ArrowLeft'&&PAGE.prev)toPage(PAGE.prev)});
// swipe gesture
let sx=0;addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>80&&Math.abs(dx)<innerWidth/2){if(dx<0&&PAGE.next)toPage(PAGE.next);if(dx>0&&PAGE.prev)toPage(PAGE.prev)}});
// tab bar sync (highlight current page in bottom nav)
const curTab={index:{'07-home':'星球','messages':'消息','messages-filter':'消息','intimacy':'我的','group-chat':'广场','persona-chat':'广场'}}[SLUG];
if(curTab){const tab=byText(curTab);if(tab){const btn=tab.closest('[data-text]')||tab.parentElement;if(btn)btn.classList.add('tab-active')}}
// generic nav rules
(PAGE.rules||[]).forEach(r=>{let el=null;if(r.text)el=byText(r.text);if(!el&&r.contains)el=byTextAny(r.contains);if(!el&&r.icon)el=byIcon(r.icon);if(!el&&r.name)el=byName(r.name);if(el){
  if(r.to)clickable(el,r.to);else if(r.act==='toast'){el.classList.add('u-click');el.addEventListener('click',()=>toast(r.msg||'敬请期待','●'))}
}});
// toggle groups (segmented / chips)
document.querySelectorAll('[data-toggle-group]').forEach(g=>{g.querySelectorAll(':scope [data-toggle]').forEach(c=>{c.classList.add('u-click');c.addEventListener('click',()=>{if(g.dataset.toggleGroup==='multi'){c.classList.toggle('chip-on')}else{g.querySelectorAll('.chip-on').forEach(x=>x.classList.remove('chip-on'));c.classList.add('chip-on')}})})});
</script>

<script>// typing prompt: cycle placeholder texts + required "如果" field gate
(function(){const ph=byText('请输入你的');if(ph){const prompts=['请输入你的\\"如果\\"...','假如有一天...','如果你可以...','如果重新选择...'];let i=0;setInterval(()=>{i=(i+1)%prompts.length;ph.textContent=prompts[i]},2500);ph.style.borderRight='1.5px solid var(--ca)';ph.style.animation='hintPulse 1s step-end infinite'}})();
// bubble entrance stagger
document.querySelectorAll('[data-name^=\"Bubble\"]').forEach((b,i)=>{b.style.animationDelay=(i*120)+'ms';b.style.animation='riseIn .5s both cubic-bezier(.22,.9,.3,1)'});
// required "如果" -> replace with real input, gate the button
(function(){const slot=byName('Input Slot');if(!slot||!slot.parentElement)return;
  const isIfSlot=(byText('如果')&&slot.parentElement.querySelector('[data-text]'));
  const ph=slot.querySelector('[data-text]');
  if(ph){const inp=document.createElement('input');inp.placeholder=ph.textContent.trim();
    const cs=getComputedStyle(ph);inp.style.cssText='background:transparent;border:none;outline:none;color:#fff;font-family:inherit;font-size:'+cs.fontSize+';width:100%';ph.replaceWith(inp);
    inp.dataset.type='如果';
    // second time: do the "我要" slot too — check it's not already done
    const allSlots=document.querySelectorAll('[data-name="Input Slot"]');
    if(allSlots.length>=2&&!allSlots[1].querySelector('input')){
      const ph2=allSlots[1].querySelector('[data-text]');
      if(ph2){const inp2=document.createElement('input');inp2.placeholder=ph2.textContent.trim();
        const cs2=getComputedStyle(ph2);inp2.style.cssText='background:transparent;border:none;outline:none;color:#fff;font-family:inherit;font-size:'+cs2.fontSize+';width:100%';ph2.replaceWith(inp2);inp2.dataset.type='我要';
      }
    }
    // gate the "就这样" button: initially disabled
    const btn=byTextAny('就这样');if(!btn)return;
    const btnBox=btn.closest('[data-name]');if(!btnBox)return;
    function update(){const ok=inp.value.trim().length>0;
      btnBox.style.opacity=ok?'1':'.35';btnBox.style.pointerEvents=ok?'auto':'none';
      btnBox.style.filter=ok?'brightness(1)':'grayscale(.6)';btnBox.style.transition='all .3s'};
    inp.addEventListener('input',update);update();
    // forward original behavior: only navigate if filled
    btnBox.addEventListener('click',function(e){if(inp.value.trim().length===0){e.stopPropagation();toast('请先填写你的"如果"','✎');return}});
  }
})();
</script>
