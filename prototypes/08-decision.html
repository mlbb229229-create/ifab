    </div>
  </div>
</div>
<script>
const PAGE = {"rules":[{"contains":"去聊聊这个","to":"persona-chat.html"}],"prev":"ip-settings.html","next":"group-chat.html"};
const SLUG = location.pathname.split('/').pop().replace(/.html$/,'')||'index';
function q1(pred){const all=[...document.querySelectorAll('[data-text],[data-name],[data-icon]')];return all.find(pred)}
function byText(t){return q1(el=>(el.dataset.text||'').trim()===t)}
function byTextAny(t){return q1(el=>((el.dataset.text||'').includes(t)))}
function byName(n){return q1(el=>(el.dataset.name||'')===n)}
function byIcon(n){return q1(el=>(el.dataset.icon||'')===n)}
function toPage(to){document.querySelector('.canvas').classList.add('page-exit');setTimeout(()=>location.href=to,230)}
function clickable(el,to){if(!el)return;let t=el;for(let i=0;i<4&&t;i++){const box=t.closest('[data-name]')||t;if(box){t=box;break}t=t.parentElement}
  t.classList.add('u-click');t.addEventListener('click',e=>{e.stopPropagation();if(to)toPage(to)})}
function toast(msg,icon){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}
  t.innerHTML=(icon?'<span class="toast-icon">'+icon+'</span>':'')+msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2000)}
// fit device to window
function fit(){const d=document.querySelector('.device');if(!d)return;const vp=document.querySelector('.viewport');
  if(innerWidth<768){const s=Math.min(1,innerWidth/vp.offsetWidth);d.style.transform=s>=1?'none':'scale('+s+')';d.style.transformOrigin='top center';return}
  const w=vp.offsetWidth+28,h=vp.offsetHeight+28;const s=Math.min(1,(innerHeight-88)/h,(innerWidth-24)/w);d.style.transform=s>=1?'none':'scale('+s+')'}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));fit();
// page enter animation
document.querySelector('.canvas').classList.add('page-enter');
setTimeout(()=>document.querySelector('.canvas').classList.remove('page-enter'),500);
// keyboard nav
addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&PAGE.next)toPage(PAGE.next);if(e.key==='ArrowLeft'&&PAGE.prev)toPage(PAGE.prev)});
// swipe gesture
let sx=0;addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>80&&Math.abs(dx)<innerWidth/2){if(dx<0&&PAGE.next)toPage(PAGE.next);if(dx>0&&PAGE.prev)toPage(PAGE.prev)}});
// tab bar sync (highlight current page in bottom nav)
const curTab={index:{'07-home':'星球','messages':'消息','messages-filter':'消息','intimacy':'我的','group-chat':'广场','persona-chat':'广场'}}[SLUG];
if(curTab){const tab=byText(curTab);if(tab){const btn=tab.closest('[data-text]')||tab.parentElement;if(btn)btn.classList.add('tab-active')}}
// generic nav rules
(PAGE.rules||[]).forEach(r=>{let el=null;if(r.text)el=byText(r.text);if(!el&&r.contains)el=byTextAny(r.contains);if(!el&&r.icon)el=byIcon(r.icon);if(!el&&r.name)el=byName(r.name);if(el){
  if(r.to)clickable(el,r.to);else if(r.act==='toast'){el.classList.add('u-click');el.addEventListener('click',()=>toast(r.msg||'敬请期待','●'))}
}});
// toggle groups (segmented / chips)
document.querySelectorAll('[data-toggle-group]').forEach(g=>{g.querySelectorAll(':scope [data-toggle]').forEach(c=>{c.classList.add('u-click');c.addEventListener('click',()=>{if(g.dataset.toggleGroup==='multi'){c.classList.toggle('chip-on')}else{g.querySelectorAll('.chip-on').forEach(x=>x.classList.remove('chip-on'));c.classList.add('chip-on')}})})});
</script>

<script>
// choice interaction: hover to see detail
document.querySelectorAll('[data-name^="split"] [data-name]').forEach(c=>{c.classList.add('u-click');c.addEventListener('click',()=>toast('选择已记录，去和 TA 聊聊吧','✓'))});
// reasoning bullet stagger
document.querySelectorAll('[data-name^="bullets"] [data-name^="row"]').forEach((r,i)=>{r.style.animationDelay=(i*80)+'ms';r.style.animation='riseIn .5s both'});
</script>
<script>(function(){var bar=document.createElement('div');
bar.style.cssText='display:flex;align-items:center;gap:4px;padding:8px 12px;background:rgba(14,14,18,.92);border-bottom:1px solid rgba(255,255,255,.06);position:sticky;top:0;z-index:40;overflow:hidden';
bar.innerHTML='<span class="icon-chevron-left" style="font-size:20px;margin-right:4px;color:#fff;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:999px;cursor:pointer;flex:none"></span><span style="font-size:15px;font-weight:600;color:rgba(255,255,255,.8)">星海首页</span>';
bar.querySelector('.icon-chevron-left').onclick=function(){toPage('07-home.html')};
var can=document.querySelector('.canvas');if(can)can.insertBefore(bar,can.firstChild);})();</script>
</body>
