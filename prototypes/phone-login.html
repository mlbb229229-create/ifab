<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

<style>
/* ========== Design Tokens ========== */
:root{--ca:#ff553d;--cb:#dc2626;--c0:#07070a;--c1:#0f0d10;--c2:#141416;--c3:#1c1c21;--c4:#2a2a30;--ct:#ffffff;--ct2:rgba(255,255,255,.85);--ct3:rgba(255,255,255,.55);--ct4:rgba(255,255,255,.25);--br:44px;--g1:linear-gradient(135deg,#dc2626,#991b1b);--g2:linear-gradient(150deg,rgba(255,255,255,.12),rgba(0,0,0,.3));--toast-z:99999;--page-z:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{margin:0;padding:0}
body{
  font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--c0);color:#fff;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  background-image:
    radial-gradient(900px 500px at 12% -10%, rgba(220,38,38,.10), transparent 60%),
    radial-gradient(700px 480px at 88% 110%, rgba(153,27,27,.08), transparent 60%);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}

/* ========== Top Bar ========== */
.topbar{width:100%;max-width:1120px;display:flex;align-items:center;gap:12px;padding:14px 20px 10px;font-size:13px;color:var(--ct3);flex:none}
.topbar a{color:var(--ct3);text-decoration:none;display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;border:1px solid var(--ct4);background:rgba(255,255,255,.04);transition:.2s}
.topbar a:hover{color:#fff;border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.08)}
.topbar .sp{flex:1}
.topbar .crumb{color:#fff;font-weight:600}
.topbar .idx{font-variant-numeric:tabular-nums;color:var(--ct4)}

/* ========== Stage / Device / Viewport ========== */
.stage{flex:1;width:100%;display:flex;align-items:flex-start;justify-content:center;padding:6px 16px 40px}
.device{position:relative;transform-origin:top center;transition:transform .25s ease}
@media (min-width: 768px){
  .device{padding:14px;border-radius:var(--br);background:linear-gradient(160deg,#1b1b20,#0c0c0f);
    box-shadow:0 40px 90px -30px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.07),inset 0 0 0 2px rgba(255,255,255,.04)}
  .device::after{content:'';position:absolute;top:26px;left:50%;transform:translateX(-50%);width:96px;height:24px;border-radius:14px;background:#050507;z-index:60;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
  .viewport{border-radius:32px}
}
.viewport{overflow-y:auto;overflow-x:hidden;position:relative;background:#000;scrollbar-width:thin;scrollbar-color:var(--ct4) transparent;scroll-behavior:smooth}
.viewport::-webkit-scrollbar{width:4px}
.viewport::-webkit-scrollbar-thumb{background:var(--ct4);border-radius:4px}
.canvas{position:relative;margin:0 auto;overflow:hidden}
.msr{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;display:inline-block;text-transform:none;letter-spacing:normal;word-wrap:normal;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
[class^="icon-"]::before{display:block}

/* ========== Page Transition ========== */
.page-exit{opacity:0 !important;transform:translateY(-8px) scale(.98) !important;transition:opacity .22s,transform .25s cubic-bezier(.4,0,.3,1) !important;pointer-events:none!important}
.page-enter{animation:pageIn .48s cubic-bezier(.2,.9,.3,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ========== Entrance & Scroll Animations ========== */
@keyframes canvasIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.canvas>*{animation:canvasIn .45s cubic-bezier(.2,.8,.3,1) both}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.rise{animation:riseIn .55s cubic-bezier(.22,.9,.3,1) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.fade-in{animation:fadeIn .5s ease both}
@keyframes floatUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.float{animation:floatUp 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.85;transform:scale(1.05)}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulseGlow{0%,100%{opacity:.75;filter:brightness(1)}50%{opacity:1;filter:brightness(1.4)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes hintPulse{0%,100%{opacity:.35}50%{opacity:.65}}
@keyframes orbit{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.orbit-spin{animation:orbit 8s linear infinite}

/* ========== Interactions ========== */
.u-click{cursor:pointer;position:relative;overflow:hidden;transition:filter .2s ease,transform .18s ease,opacity .18s ease}
.u-click:hover{filter:brightness(1.22)}
.u-click:active{transform:scale(.95)}
.u-click:active::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,.15);animation:rippleIn .35s ease-out}
@keyframes rippleIn{from{opacity:1;transform:scale(0);border-radius:50%}to{opacity:0;transform:scale(2.5);border-radius:inherit}}
.chip-on{outline:1.5px solid rgba(255,85,61,.85);outline-offset:-1.5px;background:rgba(255,85,61,.18)!important}
.tab-active{background:rgba(255,85,61,.16)!important;color:var(--ca)!important}
.tab-active .msr,.tab-active [class^="icon-"]{color:var(--ca)!important}

/* ========== Button Enhancements ========== */
[data-name*="btn" i],[data-name*="CTA" i],[data-name*="Button" i],[data-name*="卡" i],[data-name*="chip" i]{cursor:pointer;transition:filter .18s ease,transform .12s ease}
[data-name*="btn" i]:hover,[data-name*="CTA" i]:hover{filter:brightness(1.25)!important}
[data-name*="btn" i]:active,[data-name*="CTA" i]:active{transform:scale(.94)!important}
[data-name*="chip" i]:active{transform:scale(.95)!important}
[data-name="Send Button"]:hover{filter:brightness(1.35)!important}
[data-name="Send Button"]:active{transform:scale(.85)!important}

/* ========== Toast ========== */
.toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%) translateY(20px);background:rgba(20,20,24,.92);border:1px solid var(--ct4);color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.22,.9,.3,1);z-index:var(--toast-z);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .toast-icon{color:var(--ca);margin-right:6px}

/* ========== Responsive ========== */
@media (max-width: 767px){
  .topbar{display:none}
  .stage{padding:0}
  .viewport{height:100dvh !important}
}
@media (prefers-reduced-motion:reduce){
  *,*::after,*::before{animation-duration:0s!important;transition-duration:0s!important}
}
</style>
</head>
<body>
<div class="topbar">

  <span class="sp"></span>
  <a href="login-modal.html">&#8592; 上一页</a>
  <a href="verification.html">下一页 &#8594;</a>
</div>
<div class="stage">
  <div class="device">
    <div class="viewport" style="width:375px;height:812px">
      <div class="canvas" style="width:375px;min-height:812px"><div data-node="oByrp" data-name="Phone Login · 手机号登录（参考复刻）" style="box-sizing: border-box; position: relative;width: 375px;height: 812px;display: block;background: radial-gradient(420px 420px at 78% 18%, rgba(220,38,38,.42) 0%, rgba(220,38,38,.10) 42%, transparent 68%), radial-gradient(360px 360px at 12% 38%, rgba(153,27,27,.36) 0%, rgba(153,27,27,.08) 46%, transparent 70%), radial-gradient(300px 260px at 55% 85%, rgba(255,85,61,.16) 0%, transparent 65%), radial-gradient(1.5px 1.5px at 22% 20%, rgba(255,255,255,.85) 50%, transparent 51%), radial-gradient(1px 1px at 64% 12%, rgba(255,255,255,.6) 50%, transparent 51%), radial-gradient(1px 1px at 82% 46%, rgba(255,255,255,.5) 50%, transparent 51%), radial-gradient(1.5px 1.5px at 38% 64%, rgba(255,255,255,.55) 50%, transparent 51%), radial-gradient(1px 1px at 50% 88%, rgba(255,255,255,.4) 50%, transparent 51%), radial-gradient(1px 1px at 8% 78%, rgba(255,255,255,.45) 50%, transparent 51%), linear-gradient(165deg, #0b0507 0%, #070409 48%, #0d0508 100%);overflow: hidden;"><div data-node="X6tNN" data-name="Background" style="box-sizing: border-box; position: relative;position: absolute; left: 0px; top: 0px;width: 375px;height: 812px;display: flex; flex-direction: row;"></div>
<div data-node="KmRi6" data-name="Overlay" style="box-sizing: border-box; position: relative;position: absolute; left: 0px; top: 0px;width: 375px;height: 812px;display: flex; flex-direction: row;"></div>
<div data-node="mtXeO" data-name="Glass Card" style="box-sizing: border-box; position: relative;position: absolute; left: 24px; top: 266px;width: 328px;height: 300px;display: flex; flex-direction: column;gap: 12px;padding: 24px 26px;box-shadow: 0px 16px 42px rgba(0,0,0,0.584), 0px -1px 10px rgba(255,255,255,0.078);backdrop-filter: blur(22px) saturate(1.35); -webkit-backdrop-filter: blur(22px) saturate(1.35);background: rgba(32,30,36,.62); border: 1px solid rgba(255,255,255,.09);border-radius: 10px;overflow: hidden;"><div data-node="iw4xC" data-name="Glass Highlight" style="box-sizing: border-box; position: relative;position: absolute; left: 14px; top: 10px;width: 300px;height: 92px;opacity: 0.2;background: linear-gradient(270deg, rgba(255,255,255,0.188) 0%, rgba(255,255,255,0.063) 60%, rgba(255,255,255,0) 100%);border-radius: 20px;"></div>
<div data-node="z9LIK" data-text="手机号登陆" style="box-sizing: border-box; position: relative;font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;font-size: 11px;font-weight: 900;letter-spacing: 3px;line-height: 1.4;color: #FFFFFF;white-space: pre-wrap; word-break: break-word; margin: 0;">手机号登陆</div>
<div data-node="R4w4C" data-name="Input" style="box-sizing: border-box; position: relative;align-self: stretch;height: 50px;display: flex; flex-direction: row;justify-content: center;align-items: center;padding: 0px 16px;box-shadow: inset 0 0 0 1.1px rgba(255,255,255,0.4);background-color: #1c212a;border-radius: 8px;"><div data-node="BggiI" data-text="输入手机号" style="box-sizing: border-box; position: relative;font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;font-size: 14px;font-weight: 800;line-height: 1.4;color: #FFFFFF;white-space: pre-wrap; word-break: break-word; margin: 0;flex: none;">输入手机号</div></div>
<div data-node="InaIo" data-name="Error Hint" data-text="手机号错误，请检查后重试" style="box-sizing: border-box; position: relative;align-self: stretch;font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;font-size: 12px;font-weight: 700;line-height: 1.4;color: #D43C33;white-space: pre-wrap; word-break: break-word; margin: 0;">手机号错误，请检查后重试</div>
<div data-node="OjNfD" data-name="CTA" style="box-sizing: border-box; position: relative;align-self: stretch;height: 54px;display: flex; flex-direction: row;justify-content: center;align-items: center;box-shadow: inset 0 0 0 0.6px rgba(255,255,255,0.4);background-color: #D43C33;border-radius: 10px;"><div data-node="Jukkg" data-text="获取验证码" style="box-sizing: border-box; position: relative;font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;font-size: 14px;font-weight: 900;line-height: 1.4;color: rgba(255,255,255,1);white-space: pre-wrap; word-break: break-word; margin: 0;flex: none;">获取验证码</div></div>
<div data-node="Nuymf" data-name="Consent" style="box-sizing: border-box; position: relative;align-self: stretch;display: flex; flex-direction: row;gap: 8px;align-items: center;"><div data-node="l3XlU" data-name="Checkbox" style="box-sizing: border-box; position: relative;width: 16px;height: 16px;box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.4);background-color: rgba(255,255,255,0.102);border-radius: 5px;"></div>
<div data-node="E9rXT" data-name="Consent Text" data-text="我已阅读并同意《用户协议》《隐私政策》" style="box-sizing: border-box; position: relative;font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;font-size: 11px;font-weight: 700;line-height: 1.4;color: #ffffff;white-space: pre-wrap; word-break: break-word; margin: 0;flex: none;">我已阅读并同意《用户协议》《隐私政策》</div></div></div></div></div>
    </div>
  </div>
</div>
<script>
const PAGE = {"rules":[{"contains":"获取验证码","to":"verification.html"}],"prev":"login-modal.html","next":"verification.html"};
const SLUG = location.pathname.split('/').pop().replace(/.html$/,'')||'index';
function q1(pred){const all=[...document.querySelectorAll('[data-text],[data-name],[data-icon]')];return all.find(pred)}
function byText(t){return q1(el=>(el.dataset.text||'').trim()===t)}
function byTextAny(t){return q1(el=>((el.dataset.text||'').includes(t)))}
function byName(n){return q1(el=>(el.dataset.name||'')===n)}
function byIcon(n){return q1(el=>(el.dataset.icon||'')===n)}
function toPage(to){document.querySelector('.canvas').classList.add('page-exit');setTimeout(()=>location.href=to,230)}
function clickable(el,to){if(!el)return;let t=el;for(let i=0;i<4&&t;i++){const box=t.closest('[data-name]')||t;if(box){t=box;break}t=t.parentElement}
  t.classList.add('u-click');t.addEventListener('click',e=>{e.stopPropagation();if(to)toPage(to)})}
function toast(msg,icon){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}
  t.innerHTML=(icon?'<span class="toast-icon">'+icon+'</span>':'')+msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2000)}
// fit device to window
function fit(){const d=document.querySelector('.device');if(!d)return;const vp=document.querySelector('.viewport');
  if(innerWidth<768){const s=Math.min(1,innerWidth/vp.offsetWidth);d.style.transform=s>=1?'none':'scale('+s+')';d.style.transformOrigin='top center';return}
  const w=vp.offsetWidth+28,h=vp.offsetHeight+28;const s=Math.min(1,(innerHeight-88)/h,(innerWidth-24)/w);d.style.transform=s>=1?'none':'scale('+s+')'}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));fit();
// page enter animation
document.querySelector('.canvas').classList.add('page-enter');
setTimeout(()=>document.querySelector('.canvas').classList.remove('page-enter'),500);
// keyboard nav
addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&PAGE.next)toPage(PAGE.next);if(e.key==='ArrowLeft'&&PAGE.prev)toPage(PAGE.prev)});
// swipe gesture
let sx=0;addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>80&&Math.abs(dx)<innerWidth/2){if(dx<0&&PAGE.next)toPage(PAGE.next);if(dx>0&&PAGE.prev)toPage(PAGE.prev)}});
// tab bar sync (highlight current page in bottom nav)
const curTab={index:{'07-home':'星球','messages':'消息','messages-filter':'消息','intimacy':'我的','group-chat':'广场','persona-chat':'广场'}}[SLUG];
if(curTab){const tab=byText(curTab);if(tab){const btn=tab.closest('[data-text]')||tab.parentElement;if(btn)btn.classList.add('tab-active')}}
// generic nav rules
(PAGE.rules||[]).forEach(r=>{let el=null;if(r.text)el=byText(r.text);if(!el&&r.contains)el=byTextAny(r.contains);if(!el&&r.icon)el=byIcon(r.icon);if(!el&&r.name)el=byName(r.name);if(el){
  if(r.to)clickable(el,r.to);else if(r.act==='toast'){el.classList.add('u-click');el.addEventListener('click',()=>toast(r.msg||'敬请期待','●'))}
}});
// toggle groups (segmented / chips)
document.querySelectorAll('[data-toggle-group]').forEach(g=>{g.querySelectorAll(':scope [data-toggle]').forEach(c=>{c.classList.add('u-click');c.addEventListener('click',()=>{if(g.dataset.toggleGroup==='multi'){c.classList.toggle('chip-on')}else{g.querySelectorAll('.chip-on').forEach(x=>x.classList.remove('chip-on'));c.classList.add('chip-on')}})})});
</script>
